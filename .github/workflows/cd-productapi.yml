name: Product CD (Build and Push to Docker Hub)

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Start API in background
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Healthcheck gate
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo " API is healthy"
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Smoke test CRUD
        run: |
          curl -sf -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CD001","pname":"Deploy Test","price":100,"quantity":5}'
          curl -sf http://localhost:3000/api/products

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_PRODUCTAPI }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_PRODUCTAPI }}/product-api:latest
            ${{ secrets.DOCKERHUB_PRODUCTAPI }}/product-api:${{ github.sha }}
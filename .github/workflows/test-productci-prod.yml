name: Product CI (Production-like with MongoDB)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-with-mongo:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start API in background
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo " API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

      - name: CRUD test
        run: |
          set -e
          echo "--- CREATE ---"
          RESPONSE=$(curl -sf -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"Test Product","price":100,"quantity":5}')
          echo "$RESPONSE"
          ID=$(echo "$RESPONSE" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8'))._id")
          echo "Created id: $ID"

          echo "--- READ ALL ---"
          curl -sf http://localhost:3000/api/products

          echo "--- READ ONE ---"
          curl -sf http://localhost:3000/api/products/$ID

          echo "--- UPDATE ---"
          UPDATED=$(curl -sf -X PUT http://localhost:3000/api/products/$ID \
            -H "Content-Type: application/json" \
            -d '{"price":200}')
          echo "$UPDATED"
          echo "$UPDATED" | grep -q '"price":200'

          echo "--- DELETE ---"
          curl -sf -X DELETE http://localhost:3000/api/products/$ID

          echo "--- VERIFY DELETED (expect 404) ---"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products/$ID)
          test "$CODE" = "404"

      - name: Show server log
        if: always()
        run: cat server.log

      - name: Stop API
        if: always()
        run: kill $(cat server.pid) || true
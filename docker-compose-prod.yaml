services:
  mongodb:
    image: mongo:6
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - product-net-prod

  product-api:
    image: tranglou/product-api:latest
    container_name: product-api
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - product-net-prod

networks:
  product-net-prod:
    driver: bridge

volumes:
  mongo_data_prod: